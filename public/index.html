<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS2 na Sala</title>
<meta name="description" content="Escolha o jogo, coloque o disco no console e jogue numa TV de tubo, tudo no navegador.">
<style>
  :root { color-scheme: dark; --fg: #eef0f6; --muted: #9aa1b2; --line: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080b; color: var(--fg);
    font: 14px 'Inter', 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; }
  /* Emulator output: hidden but still rendering and focusable (it is copied onto the TV). */
  /* Its pixel size follows the emulator output (upscaling); the layout size stays put. */
  #outputCanvas { position: fixed; left: 0; top: 0; width: 640px; height: 480px; opacity: .01; z-index: -1; pointer-events: none; }
  #stage { position: fixed; inset: 0; }
  #library { position: fixed; inset: 0; z-index: 2;
    background: linear-gradient(to bottom, rgba(5,6,9,.55), rgba(5,6,9,.25) 40%, rgba(5,6,9,.8)); }
  #library[hidden] { display: none; }
  #hud { position: fixed; z-index: 3; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; justify-content: center; transition: opacity .4s; }
  #hud[hidden] { display: none; }
  #hud.idle { opacity: 0; }
  #hud button { font: inherit; color: var(--fg); background: rgba(12,14,20,.72); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 16px; min-height: 40px; cursor: pointer; backdrop-filter: blur(8px); }
  #hud button:hover { background: rgba(40,48,70,.8); }
  #hud button:disabled { opacity: .45; cursor: default; }
  #hud button:focus-visible { outline: 2px solid #5aa9ff; outline-offset: 2px; }
  #fps, #msg { font: 12px ui-monospace, monospace; color: var(--muted); padding: 0 6px; }
  #msg { position: fixed; z-index: 3; left: 16px; right: 16px; top: 16px; text-align: center; font-size: 14px; color: var(--fg); }
  #msg.err { color: #ff8a8a; }
  #keys { width: 100%; text-align: center; color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) { #keys { display: none; } }
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
</head>
<body>
<canvas id="outputCanvas" width="640" height="480" tabindex="-1" aria-label="Tela do jogo"></canvas>
<div id="stage"></div>
<div id="library"></div>
<p id="msg" role="status" aria-live="polite"></p>
<div id="hud" hidden>
  <button type="button" id="b-lib">Trocar jogo</button>
  <button type="button" id="b-save" title="Salva o ponto atual deste jogo (F5)">Salvar</button>
  <button type="button" id="b-load" title="Volta para o último ponto salvo (F8)">Carregar</button>
  <button type="button" id="b-fs">Tela cheia</button>
  <button type="button" id="b-crt" aria-pressed="true">Efeito CRT: ligado</button>
  <button type="button" id="b-set" aria-haspopup="dialog">Configurações</button>
  <span id="fps"></span>
  <p id="keys"></p>
</div>
<script type="module">
  import * as emu from "./js/emulator.js";
  import { createConsoleScene } from "./js/console-scene.js";
  import { createCrtTv } from "./js/crt-tv.js";
  import { createLibraryUI, renderDiscLabel } from "./js/library.js";
  import { createSettings, keyHint } from "./js/settings.js";

  const $ = (id) => document.getElementById(id);
  const msg = (text, err = false) => { $("msg").textContent = text; $("msg").className = err ? "err" : ""; };

  const view = createConsoleScene($("stage"));
  let settings = null; // created right after the TV (it applies the CRT settings to it)
  const tv = createCrtTv({ sourceCanvas: $("outputCanvas"), frameId: emu.frameId, onCrtChange: (on) => settings?.set("crt", on) });
  view.tvAnchor.add(tv.object3d);
  view.onFrame((dt) => tv.update(dt, view.renderer)); // runs every frame for the live TV (only the screen is redrawn)

  function syncHud(s) {
    $("b-crt").setAttribute("aria-pressed", String(s.crt));
    $("b-crt").textContent = `Efeito CRT: ${s.crt ? "ligado" : "desligado"}`;
    $("keys").textContent = keyHint(s);
  }
  settings = createSettings({
    tv, getModule: emu.getModule, onChange: syncHud,
    onClose: () => { if (!$("hud").hidden) $("outputCanvas").focus(); }, // keys go back to the game
  });
  syncHud(settings.settings);

  // Load the emulator in the background while the user browses the shelf.
  const emuReady = emu.init();
  emuReady.then(() => settings.applyEmulator(), (e) => msg("Não foi possível iniciar o emulador: " + e.message, true));

  let fpsTimer = 0, busy = false;

  const library = createLibraryUI($("library"), { onPlay: play, onSettings: () => settings.open() });

  async function play(game, file) {
    if (busy) return;
    busy = true;
    try {
      library.hide();
      $("library").hidden = true;
      msg("");
      await view.insertDisc({ id: game.id, title: game.title, color: game.palette?.accent ?? "#5aa9ff", labelCanvas: renderDiscLabel(game) });
      tv.setSignal(false);
      await Promise.all([tv.setPower(true), view.focusTv()]);
      await emuReady;
      await emu.boot(file);
      tv.setSignal(true);
      showHud();
    } catch (e) {
      console.error(e);
      msg(`Falha ao iniciar ${game.title}: ${e.message}`, true);
      await backToLibrary();
    } finally {
      busy = false;
    }
  }

  // Going back pauses the emulator (CPU and audio idle); booting another game resets it.
  async function backToLibrary() {
    emu.pause();
    $("hud").hidden = true;
    clearInterval(fpsTimer);
    if (tv.isFullscreen()) await tv.exitFullscreen();
    tv.setSignal(false);
    await Promise.all([tv.setPower(false), view.focusConsole()]);
    await view.ejectDisc();
    $("library").hidden = false;
    library.show();
    await library.refresh();
  }

  function showHud() {
    $("hud").hidden = false;
    emu.hasSavedState().then((has) => ($("b-load").disabled = !has));
    emu.takeFrames();
    clearInterval(fpsTimer);
    fpsTimer = setInterval(() => { $("fps").textContent = `${emu.takeFrames()} FPS`; }, 1000);
    $("outputCanvas").focus();
  }

  $("b-lib").addEventListener("click", () => { if (!busy) { busy = true; backToLibrary().finally(() => (busy = false)); } });
  $("b-fs").addEventListener("click", () => tv.enterFullscreen());

  addEventListener("ps2-disc-error", (e) => msg(`Erro ao ler o disco: ${e.detail?.message ?? e.detail}`, true));

  async function quickState(save) {
    if (busy) return;
    busy = true;
    msg(save ? "Salvando…" : "Carregando…");
    try {
      await (save ? emu.saveState() : emu.loadState());
      msg(save ? "Estado salvo." : "Estado carregado.");
      $("b-load").disabled = false;
      setTimeout(() => msg(""), 2500);
    } catch (e) {
      msg(e.message, true);
    } finally {
      busy = false;
      $("outputCanvas").focus();
    }
  }
  $("b-save").addEventListener("click", () => quickState(true));
  $("b-load").addEventListener("click", () => quickState(false));
  addEventListener("keydown", (e) => {
    if ($("hud").hidden || e.repeat || settings.isOpen()) return;
    if (e.key === "F5") { e.preventDefault(); quickState(true); }
    else if (e.key === "F8") { e.preventDefault(); quickState(false); }
  }, true);
  $("b-crt").addEventListener("click", () => settings.set("crt", !settings.settings.crt));
  $("b-set").addEventListener("click", () => settings.open());

  // Fade the HUD out while playing; any mouse movement brings it back.
  let idleTimer = 0;
  addEventListener("pointermove", () => {
    $("hud").classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => $("hud").classList.add("idle"), 3000);
  });
</script>
</body>
</html>
